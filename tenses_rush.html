const PC=['Purple','Blue','Green','Orange'];let names=[],G=null,lastLv=0;
PC.forEach((c,i)=>{const n=el('input','pin');n.style.setProperty('--c',`var(--p${i})`);n.placeholder=`Player ${i+1} (${c})`;n.maxLength=12;n.id='pn'+i;$('#pins').appendChild(n)});
$('#bstart').onclick=()=>{let ok=true;names=[];for(let i=0;i<4;i++){const n=$('#pn'+i),v=n.value.trim();n.classList.remove('err');if(!v){ok=false;void n.offsetWidth;n.classList.add('err')}names.push(v)}if(ok)go('diff')};
LV.forEach((l,i)=>{const b=el('button','btn dif'+(i==1?' g':i==2?' o':''));b.innerHTML=`${['🟢','🔵','🟠','🔴'][i]} ${l}<small>${LD[i]}</small>`;b.onclick=()=>startGame(i);$('#dg').appendChild(b)});
/* ===== GAME ===== */
function startGame(lv){lastLv=lv;G={lv,pool:shuf(Q.filter(q=>q.lv==lv)),pi:0,qn:0,ph:'cd',players:names.map((n,i)=>({n,i,sc:0,st:0,mx:0,ok:0,bad:0,tm:[],hn:0}))};buildArena();show('arena');music(null);
 const ov=$('#ov');ov.classList.add('on');let c=3;const step=()=>{if(!G||G.ph!='cd')return;if(c>0){ov.innerHTML=`<span>${c}</span>`;sfx('beep');c--;setTimeout(step,850)}else{ov.innerHTML='<span>GO!</span>';sfx('go');music('b');setTimeout(()=>{ov.classList.remove('on');G.end=performance.now()+180000;G.ph='q';showQ()},700)}};step()}
function buildArena(){const g=$('#grid');g.innerHTML='';G.players.forEach(p=>{const a=el('div','area');a.style.setProperty('--c',`var(--p${p.i})`);a.innerHTML='<div class=ph><b></b><span class=sc>0</span></div><div class=st></div><div class=ql></div><div class=ans></div><div class=bank></div><div class=btns><button class="btn g">✔ CHECK</button><button class="btn s">↺ RESET</button><button class="btn o">💡 HINT</button></div><div class=msg></div><div class=fb></div>';a.querySelector('b').textContent=p.n;const q=s=>a.querySelector(s);p.e={a,sc:q('.sc'),st:q('.st'),ql:q('.ql'),ans:q('.ans'),bank:q('.bank'),msg:q('.msg'),fb:q('.fb')};const bt=a.querySelectorAll('.btns .btn');bt[0].onclick=()=>check(p);bt[1].onclick=()=>{if(canAct(p)){p.ans=[];render(p)}};bt[2].onclick=()=>hint(p);g.appendChild(a);upd(p)})}
const canAct=p=>G&&G.ph=='q'&&!p.done;
function nextQ(){if(G.pi>=G.pool.length){G.pool=shuf(G.pool);G.pi=0}return G.pool[G.pi++]}
function showQ(){const q=G.q=nextQ(),n=performance.now();G.qn++;G.first=false;G.ph='q';G.qStart=n;G.qEnd=n+30000;$('#qi').textContent='Soal #'+G.qn;
 G.players.forEach(p=>{p.done=false;p.hint=false;let t;do{t=shuf(q.w.map((w,i)=>({w,i})))}while(q.w.length>2&&t.every((x,i)=>x.i==i));p.tiles=t;p.ans=[];p.e.fb.classList.remove('on');p.e.ql.textContent=`#${G.qn} · ${q.tn} · ${q.fm} — Arrange the words! Susun kata!`;render(p)})}
function tile(p,ix,m){const b=el('button','t');b.textContent=p.tiles[ix].w;b.onclick=()=>{if(!canAct(p))return;if(m=='b'){p.ans.push(ix);render(p);p.e.ans.querySelector('.t:last-of-type').classList.add('pop')}else{p.ans=p.ans.filter(x=>x!=ix);render(p)}sfx('click')};return b}
function render(p){p.e.bank.innerHTML='';p.e.ans.innerHTML='';p.tiles.forEach((t,ix)=>{if(!p.ans.includes(ix))p.e.bank.appendChild(tile(p,ix,'b'))});p.ans.forEach(ix=>p.e.ans.appendChild(tile(p,ix,'a')));const s=el('span','pu');s.textContent=G.q.pu;p.e.ans.appendChild(s)}
function upd(p){p.e.sc.textContent=p.sc;p.e.sc.classList.remove('pop');void p.e.sc.offsetWidth;p.e.sc.classList.add('pop');p.e.st.textContent=`🔥 Combo x${p.st} · ✔ Benar ${p.ok}`}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function say(p,t,c){const m=p.e.msg;m.textContent=t;m.style.color=c;m.classList.remove('on');void m.offsetWidth;m.classList.add('on')}
function fb(p,ok,pts){const q=G.q;p.e.fb.innerHTML=`<h3 class="${ok?'ok':'bd'}">${ok?'✔ Correct! Jawaban benar! '+pts:"⏱ Time's up! Waktu habis"}</h3><div class=s1>${esc(q.a)}</div><div><b>${q.tn}</b> · ${q.fm}</div><p>${q.ex}</p><p><i>🇮🇩 ${esc(q.tr)}</i></p><small>Menunggu pemain lain… / Next question soon…</small>`;p.e.fb.classList.add('on')}
function check(p){if(!canAct(p))return;const q=G.q,s=p.ans.map(i=>p.tiles[i].w).join(' ');
 if(!p.ans.length)return say(p,'Susun kata dulu!','#f59e0b');
 if([q.a,...q.alt].some(a=>norm(a)==norm(s))){p.done=true;p.ok++;p.st++;p.mx=Math.max(p.mx,p.st);p.tm.push((performance.now()-G.qStart)/1000);let g=100,t=['+100'];
  if(!G.first){G.first=true;g+=50;t.push('⚡Speed +50')}if(!p.hint){g+=25;t.push('✨+25')}const cb=p.st%3==0;if(cb){g+=50;t.push('🔥Combo +50')}
  p.sc+=g;upd(p);sfx(cb?'combo':'ok');say(p,t.join(' '),'#22c55e');fb(p,true,'+'+g);setTimeout(()=>{if(p.done)p.e.fb.classList.contains('on')||0},0)}
 else{p.bad++;p.st=0;upd(p);sfx('bad');say(p,'Incorrect! Try again!','#ef4444');p.e.a.classList.remove('shk');void p.e.a.offsetWidth;p.e.a.classList.add('shk')}}
function hint(p){if(!canAct(p))return;const w=G.q.w;let ok=p.ans.every((ix,i)=>p.tiles[ix].w==w[i]);if(!ok)p.ans=[];if(p.ans.length>=w.length)return;const ix=p.tiles.findIndex((t,i)=>t.w==w[p.ans.length]&&!p.ans.includes(i));p.ans.push(ix);p.hint=true;p.sc-=25;p.hn++;upd(p);render(p);say(p,'💡 Hint −25','#f59e0b')}
function tick(){if(!G||G.ph=='cd'||G.ph=='end')return;const n=performance.now(),rem=Math.max(0,G.end-n),s=Math.ceil(rem/1000),t=$('#tm');t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
 if(rem<=10000){t.classList.add('warn');if(G.ls!=s){G.ls=s;sfx('warn')}}else t.classList.remove('warn');
 if(rem<=0)return finish();
 if(G.ph=='q'){if(n>=G.qEnd){G.players.forEach(p=>{if(!p.done){p.done=true;fb(p,false);p.st=0;upd(p)}});G.ph='gap';G.gap=n+4500}else if(G.players.every(p=>p.done)){G.ph='gap';G.gap=n+3500}}
 else if(G.ph=='gap'&&n>=G.gap)showQ()}
setInterval(tick,100);
$('#bq').onclick=()=>{if(confirm('Keluar dari pertandingan? / Quit match?')){G.ph='end';music('m');go('menu')}};
function finish(){G.ph='end';music(null);sfx('end');setTimeout(victory,500);
 const R=G.players.map(p=>({...p,acc:p.ok+p.bad?Math.round(p.ok/(p.ok+p.bad)*100):0,avg:p.tm.length?p.tm.reduce((a,b)=>a+b)/p.tm.length:0,fast:p.tm.length?Math.min(...p.tm):0})).sort((a,b)=>b.sc-a.sc||b.ok-a.ok||(a.avg||99)-(b.avg||99));
 $('#rk').innerHTML='';R.forEach((p,i)=>{const d=el('div','rc'+(i==0?' w':''));d.style.setProperty('--c',`var(--p${p.i})`);d.innerHTML=`<h3>${['🥇','🥈','🥉','4️⃣'][i]} <span class=nm></span></h3><b style="font-size:1.6em">${p.sc} pts</b><br>✔ Benar: ${p.ok} · ✖ Salah: ${p.bad}<br>🎯 Akurasi: ${p.acc}%<br>🔥 Combo tertinggi: ${p.mx}<br>⚡ Rata-rata: ${p.avg.toFixed(1)}s · Tercepat: ${p.fast.toFixed(1)}s<br>💡 Hint: ${p.hn}`;d.querySelector('.nm').textContent=p.n;$('#rk').appendChild(d)});
 let lb=[];try{lb=JSON.parse(localStorage.getItem('tensesRush')||'[]')}catch(e){}R.forEach(p=>lb.push({n:p.n,s:p.sc,l:LV[G.lv]}));lb.sort((a,b)=>b.s-a.s);lb=lb.slice(0,10);try{localStorage.setItem('tensesRush',JSON.stringify(lb))}catch(e){}
 $('#lb').innerHTML='🏅 Leaderboard: '+lb.slice(0,5).map((e,i)=>`${i+1}. ${esc(e.n)} ${e.s} (${e.l})`).join(' · ');show('res');confetti()}
$('#bagain').onclick=()=>startGame(lastLv);
function confetti(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,s:5+Math.random()*8,c:`hsl(${Math.random()*360},90%,60%)`,r:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);p.r+=.1;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s*.6)});if(++f<420)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
</script></body></html>
